name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

jobs:
  build:
    name: Build edgewall
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev

      - name: Generate BPF code
        run: just generate

      - name: Extract version from tag
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          mkdir -p build
          go build -ldflags "-X github.com/nipunattri1/xdp-firewall/cmd.version=${{ steps.version.outputs.version }} -s -w" -o build/edgewall .

      - name: Verify version
        run: |
          ./build/edgewall --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgewall-linux-amd64
          path: build/edgewall
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: edgewall ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            build/edgewall
            config/edgectl.yaml.example
          generate_release_notes: true

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run tests
        run: go test -count=1 ./...