name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

jobs:
  build:
    name: Build edgewall
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Build with Just
        run: just build

      - name: Verify version
        run: |
          ./build/edgewall --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgewall-linux-amd64
          path: build/edgewall
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: edgewall ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            build/edgewall
            config/edgectl.yaml.example
          generate_release_notes: true

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run tests
        run: just test